    <!-- Restore the original path after a 404 → / redirect (used for /en routing) -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('gh-redirect');
        if (redirect) {
          sessionStorage.removeItem('gh-redirect');
          if (redirect !== location.pathname + location.search + location.hash) {
            history.replaceState(null, '', redirect);
          }
        }

        // Consolidate visitors on the official CEIBS subdomain. A server-side
        // 301 should replace this fallback when the old domain's DNS allows it.
        if (location.hostname === 'catchinguptoamerica.work') {
          location.replace(
            'https://zhutian.ceibs.edu' +
              location.pathname +
              location.search +
              location.hash
          );
        }
      })();
    </script>
